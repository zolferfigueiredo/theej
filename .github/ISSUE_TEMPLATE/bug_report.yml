name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: What you expected, what you got instead, and a screenshot if it helps.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Give knob A the job ...
        2. Turn it ...
  - type: input
    attributes:
      label: TheeJ version
      description: Shown in the About tab of Settings.
    validations:
      required: true
  - type: input
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    attributes:
      label: Mac and board
      description: Apple silicon or Intel, and your boards (a deej board with how many knobs and which Arduino, an SMC-Mixer over USB or Bluetooth, or another MIDI controller).
  - type: input
    attributes:
      label: Screens and keyboards
      description: Only if it's about one, for example a Dell U2723QE over USB-C, or a Keychron K8 Pro.
