name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:  # a newer push to the same branch replaces the run
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version check compares with the base branch
      - name: Shellcheck the scripts
        run: |
          command -v shellcheck >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install shellcheck
          shellcheck build.sh install.sh release.sh run.sh .githooks/pre-commit
      # Any compiler warning fails the run.
      - run: swift test -Xswiftc -warnings-as-errors
      - run: swift build -c release -Xswiftc -warnings-as-errors
      - name: A change to the app raises its version
        if: github.event_name == 'pull_request'
        run: |
          base=origin/${{ github.base_ref }}
          if git diff --quiet "$base"...HEAD -- Sources Package.swift; then echo "The app is unchanged."; exit 0; fi
          version() { git show "$1:Sources/TheeJ/Version.swift" | sed -n 's/^let appVersion = "\(.*\)"$/\1/p'; }
          old=$(version "$base") new=$(version HEAD)
          if [ "$new" = "$old" ] || [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=Sources/TheeJ/Version.swift::The app changed, so appVersion has to go above $old (it is $new)."
            exit 1
          fi
          echo "$old -> $new"
