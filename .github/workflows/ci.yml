name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:  # a newer push to the same branch replaces the run
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04 # macOS runners bill 10x on this private repo
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version check compares with the base branch
      - run: shellcheck build.sh install.sh release.sh run.sh .githooks/pre-commit
      # Everything that needs AppKit is behind #if canImport(AppKit), so Linux builds and tests the
      # rest: the knob model and its saving, calibration, the serial lines, translations and versions.
      - run: swift test -Xswiftc -warnings-as-errors
      - name: A change to the app raises its version
        if: github.event_name == 'pull_request'
        run: |
          base=origin/${{ github.base_ref }}
          if git diff --quiet "$base"...HEAD -- Sources Package.swift; then echo "The app is unchanged."; exit 0; fi
          version() { git show "$1:Sources/TheeJ/Version.swift" | sed -n 's/^let appVersion = "\(.*\)"$/\1/p'; }
          old=$(version "$base") new=$(version HEAD)
          if [ "$new" = "$old" ] || [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
            echo "::error file=Sources/TheeJ/Version.swift::The app changed, so appVersion has to go above $old (it is $new)."
            exit 1
          fi
          echo "$old -> $new"
